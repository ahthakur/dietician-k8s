<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dietician</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
--ease-out:cubic-bezier(0.23,1,0.32,1);
--ease-in-out:cubic-bezier(0.77,0,0.175,1);
--ease-spring:cubic-bezier(0.34,1.56,0.64,1);
--bg:10,10,15;
--glass:rgba(255,255,255,0.04);
--glass-border:rgba(255,255,255,0.08);
--glass-hover:rgba(255,255,255,0.1);
--blue:#3B82F6;
--pink:#EC4899;
--green:#4ADE80;
--amber:#FBBF24;
--red:#EF4444;
--radius:16px;
--radius-sm:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:rgb(var(--bg));color:#fff;min-height:100vh;min-height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow-x:hidden}

/* ── Header ──────────────────────────────────── */
.header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(var(--bg),0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:5;border-bottom:1px solid rgba(255,255,255,0.06)}
.logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;background:linear-gradient(135deg,#fff 60%,rgba(255,255,255,0.5));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ── Content ─────────────────────────────────── */
.content{padding:20px 20px 120px;animation:contentIn 400ms var(--ease-out) both}
@keyframes contentIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Glass Card base ─────────────────────────── */
.glass-card{background:linear-gradient(135deg,rgba(255,255,255,0.06) 0%,rgba(255,255,255,0.02) 100%);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* ── Macro summary ───────────────────────────── */
.macro-bar{display:flex;gap:8px;margin-bottom:24px}
.macro-pill{flex:1;padding:16px 10px 14px;background:linear-gradient(145deg,rgba(255,255,255,0.07) 0%,rgba(255,255,255,0.02) 100%);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius);text-align:center;position:relative;overflow:hidden;opacity:0;animation:pillIn 500ms var(--ease-out) forwards}
.macro-pill::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent)}
.macro-pill:nth-child(1){animation-delay:80ms}
.macro-pill:nth-child(2){animation-delay:160ms}
.macro-pill:nth-child(3){animation-delay:240ms}
@keyframes pillIn{from{opacity:0;transform:translateY(16px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.macro-pill-val{font-size:28px;font-weight:700;line-height:1;letter-spacing:-0.02em}
.macro-pill-sub{font-size:12px;color:rgba(255,255,255,0.6);margin-top:4px}
.macro-pill-label{font-size:9px;color:rgba(255,255,255,0.45);margin-top:4px;text-transform:uppercase;letter-spacing:0.1em;font-weight:600}
.macro-bar-progress{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;margin-top:10px;overflow:hidden}
.macro-bar-fill{height:100%;border-radius:2px;transition:width 600ms var(--ease-out);position:relative}
.macro-bar-fill::after{content:'';position:absolute;top:0;right:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3));border-radius:2px}

/* ── Chat ────────────────────────────────────── */
.chat-area{margin-bottom:24px}
.chat-messages{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;max-height:300px;overflow-y:auto;scroll-behavior:smooth}
.chat-bubble{max-width:82%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5;animation:bubbleIn 350ms var(--ease-out) both}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.chat-user{align-self:flex-end;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;border-bottom-right-radius:6px;box-shadow:0 2px 12px rgba(59,130,246,0.2)}
.chat-bot{align-self:flex-start;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.06);color:rgba(255,255,255,0.85);border-bottom-left-radius:6px}
.chat-log{align-self:flex-start;background:rgba(74,222,128,0.08);border:1px solid rgba(74,222,128,0.15);color:var(--green);border-bottom-left-radius:6px}

/* ── Input ────────────────────────────────────── */
.input-area{position:relative}
.input-area input{width:100%;padding:16px 52px 16px 20px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius);color:#fff;font-size:15px;outline:none;font-family:'DM Sans',sans-serif;transition:border-color 250ms var(--ease-out),box-shadow 250ms var(--ease-out)}
.input-area input:focus{border-color:rgba(59,130,246,0.4);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.input-area input::placeholder{color:rgba(255,255,255,0.22)}
.send-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 160ms var(--ease-out),opacity 200ms var(--ease-out),box-shadow 200ms var(--ease-out);box-shadow:0 2px 10px rgba(59,130,246,0.3)}
.send-btn:active{transform:translateY(-50%) scale(0.88)}
.send-btn:disabled{opacity:0.3;box-shadow:none}

/* ── Quick actions ───────────────────────────── */
.quick-actions{display:flex;gap:8px;margin-top:14px}
.qa-btn{flex:1;padding:14px 8px;background:linear-gradient(145deg,rgba(255,255,255,0.06) 0%,rgba(255,255,255,0.02) 100%);border:1px solid rgba(255,255,255,0.08);border-radius:var(--radius-sm);color:rgba(255,255,255,0.75);font-size:12px;font-weight:600;cursor:pointer;text-align:center;font-family:'DM Sans',sans-serif;transition:transform 160ms var(--ease-out),background 200ms var(--ease-out),border-color 200ms var(--ease-out)}
.qa-btn:active{transform:scale(0.96);background:rgba(255,255,255,0.1)}

/* ── Workout banner ──────────────────────────── */
.workout-bar{padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-bottom:20px;display:flex;align-items:center;gap:10px;animation:fadeSlideIn 400ms var(--ease-out) both}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.wb-active{background:linear-gradient(135deg,rgba(251,146,60,0.12) 0%,rgba(251,146,60,0.04) 100%);border:1px solid rgba(251,146,60,0.2);color:#FB923C}
.wb-rest{background:linear-gradient(135deg,rgba(74,222,128,0.08) 0%,rgba(74,222,128,0.02) 100%);border:1px solid rgba(74,222,128,0.15);color:var(--green)}

/* ── Timeline ────────────────────────────────── */
.timeline{margin-top:28px}
.tl-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tl-title{font-size:14px;font-weight:700;color:rgba(255,255,255,0.6)}
.tl-entry{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:linear-gradient(145deg,rgba(255,255,255,0.05) 0%,rgba(255,255,255,0.02) 100%);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);margin-bottom:8px;opacity:0;animation:entryIn 450ms var(--ease-out) forwards;position:relative;overflow:hidden}
.tl-entry::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0;background:var(--ec,#666)}
.tl-entry:nth-child(1){animation-delay:60ms}
.tl-entry:nth-child(2){animation-delay:120ms}
.tl-entry:nth-child(3){animation-delay:180ms}
.tl-entry:nth-child(4){animation-delay:240ms}
.tl-entry:nth-child(5){animation-delay:300ms}
.tl-entry:nth-child(6){animation-delay:360ms}
.tl-entry:nth-child(n+7){animation-delay:400ms}
@keyframes entryIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.tl-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;box-shadow:0 0 8px currentColor}
.tl-content{flex:1;min-width:0}
.tl-desc{font-size:14px;font-weight:500;color:rgba(255,255,255,0.85);margin-bottom:6px}
.tl-macros{display:flex;gap:12px;font-size:11px;color:rgba(255,255,255,0.4);flex-wrap:wrap}
.tl-entry-actions{display:flex;gap:8px;margin-top:10px}
.tl-action-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:rgba(255,255,255,0.4);cursor:pointer;font-size:11px;padding:5px 12px;font-family:'DM Sans',sans-serif;transition:transform 160ms var(--ease-out),background 200ms var(--ease-out),border-color 200ms var(--ease-out)}
.tl-action-btn:active{transform:scale(0.94);background:rgba(255,255,255,0.08)}
.tl-del{color:rgba(239,68,68,0.5)}
.tl-empty{text-align:center;padding:40px 20px;color:rgba(255,255,255,0.2);font-size:14px;line-height:1.6}

/* ── Analysis ────────────────────────────────── */
.chart-container{margin-bottom:28px;padding:20px;background:linear-gradient(145deg,rgba(255,255,255,0.05) 0%,rgba(255,255,255,0.02) 100%);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius);animation:fadeSlideIn 450ms var(--ease-out) both}
.chart-title{font-size:12px;font-weight:700;color:rgba(255,255,255,0.5);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.08em}
.chart-toggle{display:flex;gap:4px;margin-bottom:20px;background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);padding:3px;border:1px solid rgba(255,255,255,0.06)}
.chart-toggle button{flex:1;padding:10px 16px;border-radius:10px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;background:transparent;color:rgba(255,255,255,0.4);transition:background 250ms var(--ease-out),color 250ms var(--ease-out),transform 160ms var(--ease-out),box-shadow 250ms var(--ease-out)}
.chart-toggle button:active{transform:scale(0.97)}
.chart-toggle button.active{background:rgba(59,130,246,0.2);color:#93BBFD;box-shadow:0 2px 8px rgba(59,130,246,0.15)}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:160px;padding:0 4px}
.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%}
.bar-wrapper{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.bar{width:70%;border-radius:4px 4px 0 0;min-height:2px;transition:height 600ms var(--ease-out)}
.bar-label{font-size:9px;color:rgba(255,255,255,0.3);text-align:center;white-space:nowrap}
.bar-val{font-size:8px;color:rgba(255,255,255,0.35)}
.chart-legend{display:flex;gap:16px;margin-top:12px;justify-content:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.5)}
.legend-dot{width:8px;height:8px;border-radius:50%}

/* ── Date nav ────────────────────────────────── */
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.date-nav button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);font-size:16px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:transform 160ms var(--ease-out),background 200ms var(--ease-out);padding:0}
.date-nav button:active{transform:scale(0.92)}
.date-nav button:disabled{opacity:0.15;cursor:default}
.date-nav button:disabled:active{transform:none}
.date-nav-center{text-align:center}
.date-nav-day{font-size:16px;font-weight:700}
.date-nav-sub{font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px}

/* ── Fridge ───────────────────────────────────── */
.photo-uploads{display:flex;gap:10px;margin-bottom:20px}
.photo-up{flex:1;padding:24px 12px;border:2px dashed rgba(255,255,255,0.1);border-radius:var(--radius);text-align:center;cursor:pointer;transition:transform 160ms var(--ease-out),border-color 250ms var(--ease-out),background 250ms var(--ease-out);background:rgba(255,255,255,0.02)}
.photo-up:active{transform:scale(0.96);border-color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.05)}
.photo-up-icon{font-size:28px;margin-bottom:6px}
.photo-up-label{font-size:11px;color:rgba(255,255,255,0.4);font-weight:500}
.fridge-add{display:flex;gap:8px;margin-bottom:20px}
.fridge-add input{padding:12px 10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);color:#fff;font-size:14px;outline:none;font-family:'DM Sans',sans-serif;min-width:0;box-sizing:border-box;transition:border-color 250ms var(--ease-out),box-shadow 250ms var(--ease-out)}
.fridge-add input:focus{border-color:rgba(59,130,246,0.4);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.fridge-add button{padding:12px 18px;border:none;border-radius:var(--radius-sm);color:#fff;font-size:18px;cursor:pointer;line-height:1;flex-shrink:0;transition:transform 160ms var(--ease-out),box-shadow 200ms var(--ease-out);box-shadow:0 2px 10px rgba(59,130,246,0.25)}
.fridge-add button:active{transform:scale(0.9)}
.fridge-cat-header{font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.1em}
.fridge-cat-header:first-child{margin-top:0}
.fridge-list{display:flex;flex-direction:column;gap:6px}
.fridge-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(145deg,rgba(255,255,255,0.05) 0%,rgba(255,255,255,0.02) 100%);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius-sm);animation:entryIn 350ms var(--ease-out) both}
.fridge-name{font-size:14px;font-weight:500;color:rgba(255,255,255,0.85)}
.fridge-qty{font-size:12px;color:rgba(255,255,255,0.35);margin-left:10px}
.fridge-actions{display:flex;gap:6px;align-items:center}
.fridge-action-btn{color:rgba(255,255,255,0.2);cursor:pointer;font-size:16px;padding:4px 6px;transition:transform 160ms var(--ease-out),color 200ms var(--ease-out);background:none;border:none}
.fridge-action-btn:active{transform:scale(0.8)}

/* ── Grocery ──────────────────────────────────── */
.grocery-cat{font-size:11px;font-weight:700;color:rgba(255,255,255,0.45);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.1em}
.grocery-item{padding:10px 14px;background:linear-gradient(145deg,rgba(255,255,255,0.05) 0%,rgba(255,255,255,0.02) 100%);border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:6px;font-size:13px;color:rgba(255,255,255,0.75);animation:entryIn 300ms var(--ease-out) both}

/* ── Buttons ──────────────────────────────────── */
.btn{padding:13px 20px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;transition:transform 160ms var(--ease-out),opacity 200ms var(--ease-out),box-shadow 200ms var(--ease-out)}
.btn:active{transform:scale(0.96)}
.btn-p{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;box-shadow:0 2px 12px rgba(59,130,246,0.25)}
.btn-g{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5)}
.btn-green{background:linear-gradient(135deg,#4ADE80,#16A34A);color:#fff;box-shadow:0 2px 12px rgba(74,222,128,0.25)}
.btn-full{width:100%;padding:15px}
.btn-sm{padding:7px 14px;font-size:11px}
.btn:disabled{opacity:0.4;box-shadow:none}
.btn:disabled:active{transform:none}

/* ── Modal ────────────────────────────────────── */
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:backdropIn 300ms var(--ease-out) forwards}
@keyframes backdropIn{from{background:rgba(0,0,0,0)}to{background:rgba(0,0,0,0.75)}}
.modal{width:100%;max-width:520px;background:linear-gradient(180deg,#1e1e36 0%,#161628 100%);border-radius:24px 24px 0 0;padding:28px 24px 44px;max-height:80vh;overflow-y:auto;overflow-x:hidden;transform:translateY(100%);animation:sheetUp 400ms var(--ease-out) forwards;border-top:1px solid rgba(255,255,255,0.08)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal::before{content:'';display:block;width:36px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;margin:0 auto 20px}
.modal h3{font-size:17px;font-weight:700;margin-bottom:20px}
.modal label{font-size:11px;color:rgba(255,255,255,0.45);display:block;margin-bottom:6px;margin-top:14px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600}
.modal input,.modal select{width:100%;padding:13px 14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:#fff;font-size:14px;outline:none;font-family:'DM Sans',sans-serif;box-sizing:border-box;transition:border-color 250ms var(--ease-out),box-shadow 250ms var(--ease-out)}
.modal input[type=time],.modal input[type=number]{-webkit-appearance:none;-moz-appearance:textfield;min-width:0;max-width:100%}
.modal input:focus,.modal select:focus{border-color:rgba(59,130,246,0.4);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
.modal select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='rgba(255,255,255,0.4)' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.modal select option{background:#1e1e36;color:#fff}

/* ── Scan review ─────────────────────────────── */
.scan-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;animation:entryIn 300ms var(--ease-out) both}
.scan-row input{flex:1;padding:11px 12px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-size:13px;outline:none;font-family:'DM Sans',sans-serif}
.scan-row input:focus{border-color:rgba(59,130,246,0.4)}
.scan-row .scan-name{flex:2}
.scan-row .scan-qty{flex:1}
.scan-del{background:none;border:none;color:rgba(239,68,68,0.5);font-size:18px;cursor:pointer;padding:4px 8px;transition:transform 160ms var(--ease-out)}
.scan-del:active{transform:scale(0.8)}

/* ── Selector toggle ─────────────────────────── */
.selector-toggle{display:flex;gap:4px;background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);padding:3px;border:1px solid rgba(255,255,255,0.06);margin-bottom:14px}
.selector-toggle button{flex:1;padding:10px 8px;border-radius:10px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;background:transparent;color:rgba(255,255,255,0.4);transition:background 250ms var(--ease-out),color 250ms var(--ease-out)}
.selector-toggle button.active{background:rgba(59,130,246,0.2);color:#93BBFD;box-shadow:0 2px 8px rgba(59,130,246,0.15)}

/* ── Bottom Nav ───────────────────────────────── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(var(--bg),0.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-around;padding:8px 0 22px;z-index:10}
.nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px;position:relative;transition:transform 160ms var(--ease-out)}
.nav-btn:active{transform:scale(0.9)}
.nav-icon{font-size:22px;transition:filter 250ms var(--ease-out),transform 250ms var(--ease-out)}.nav-icon.off{filter:grayscale(0.8) brightness(0.7)}.nav-icon:not(.off){filter:none;transform:scale(1.05)}
.nav-lbl{font-size:10px;font-weight:600;font-family:'DM Sans',sans-serif;transition:color 250ms var(--ease-out)}
.nav-dot{width:4px;height:4px;border-radius:50%;position:absolute;bottom:2px;transition:opacity 250ms var(--ease-out),transform 250ms var(--ease-out)}
.nav-dot.off{opacity:0;transform:scale(0)}
.nav-dot:not(.off){opacity:1;transform:scale(1)}

.hidden{display:none!important}

/* ── Toast ────────────────────────────────────── */
.toast{position:fixed;top:20px;left:50%;z-index:100;padding:12px 22px;border-radius:14px;font-size:13px;font-weight:500;cursor:pointer;max-width:360px;transform:translateX(-50%) translateY(-24px);opacity:0;transition:transform 250ms var(--ease-out),opacity 200ms var(--ease-out);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.hiding{transform:translateX(-50%) translateY(-16px);opacity:0}

/* ── Averages card ───────────────────────────── */
.avg-card{padding:20px;background:linear-gradient(145deg,rgba(255,255,255,0.05) 0%,rgba(255,255,255,0.02) 100%);border:1px solid rgba(255,255,255,0.06);border-radius:var(--radius)}
.avg-title{font-size:11px;font-weight:700;color:rgba(255,255,255,0.4);margin-bottom:14px;text-transform:uppercase;letter-spacing:0.08em}
.avg-row{display:flex;gap:16px;flex-wrap:wrap}
.avg-item span:first-child{font-size:22px;font-weight:700;letter-spacing:-0.02em}
.avg-item span:last-child{font-size:11px;color:rgba(255,255,255,0.3);margin-left:2px}

/* ── Empty / CTA states ──────────────────────── */
.empty-state{text-align:center;padding:48px 24px}
.empty-icon{font-size:44px;margin-bottom:16px;opacity:0.8}
.empty-text{font-size:15px;color:rgba(255,255,255,0.28);margin-bottom:20px;line-height:1.5}

@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

/* ── Hover (pointer devices only) ────────────── */
@media(hover:hover) and (pointer:fine){
.qa-btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.14);transform:translateY(-1px)}
.tl-entry:hover{background:linear-gradient(145deg,rgba(255,255,255,0.07) 0%,rgba(255,255,255,0.03) 100%);border-color:rgba(255,255,255,0.1)}
.tl-action-btn:hover{border-color:rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);background:rgba(255,255,255,0.06)}
.tl-del:hover{color:rgba(239,68,68,0.7);border-color:rgba(239,68,68,0.2);background:rgba(239,68,68,0.06)}
.photo-up:hover{border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.04)}
.fridge-action-btn:hover{color:rgba(255,255,255,0.6)}
.fridge-row:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.1)}
.nav-btn:hover .nav-icon.off{filter:grayscale(0.4) brightness(0.85)}
.date-nav button:hover:not(:disabled){background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.12)}
.chart-toggle button:hover,.selector-toggle button:hover{background:rgba(255,255,255,0.08)}
.btn-p:hover{box-shadow:0 4px 20px rgba(59,130,246,0.35);transform:translateY(-1px)}
.btn-green:hover{box-shadow:0 4px 20px rgba(74,222,128,0.35);transform:translateY(-1px)}
.btn-g:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.14)}
.grocery-item:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.1)}
.send-btn:hover{box-shadow:0 4px 16px rgba(59,130,246,0.4)}
.macro-pill:hover{border-color:rgba(255,255,255,0.12)}
}

/* ── Reduced motion ──────────────────────────── */
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important}
}
</style>
</head>
<body>

<div id="loginScreen" class="hidden" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;text-align:center">
  <div style="font-size:64px;margin-bottom:20px">🥗</div>
  <h1 style="font-family:'Playfair Display',serif;font-size:32px;margin-bottom:8px;background:linear-gradient(135deg,#fff 60%,rgba(255,255,255,0.5));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Personal Dietician</h1>
  <p style="color:rgba(255,255,255,0.35);font-size:14px;margin-bottom:36px">AI-powered nutrition tracking</p>
  <a href="/auth/login" style="display:inline-flex;align-items:center;gap:12px;padding:14px 28px;background:#fff;color:#333;border-radius:12px;font-size:15px;font-weight:600;text-decoration:none;transition:transform 160ms,box-shadow 200ms;box-shadow:0 4px 16px rgba(0,0,0,0.2)">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Sign in with Google
  </a>
</div>

<div id="appShell" class="hidden">
<div class="header">
  <div class="logo">🥗 Dietician</div>
  <div style="display:flex;align-items:center;gap:10px">
    <span id="userName" style="font-size:13px;color:rgba(255,255,255,0.5);font-weight:500"></span>
    <img id="userPic" style="width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,0.1);cursor:pointer;display:none" onclick="showProfileMenu()" alt="">
  </div>
</div>

<div class="content" id="content"></div>

<div class="bottom-nav">
  <button class="nav-btn" onclick="setTab('home')"><span class="nav-icon" id="navHome">🏠</span><span class="nav-lbl" id="lblHome">Home</span><span class="nav-dot" id="dotHome"></span></button>
  <button class="nav-btn" onclick="setTab('analysis')"><span class="nav-icon off" id="navAnalysis">📊</span><span class="nav-lbl" id="lblAnalysis" style="color:rgba(255,255,255,0.25)">Analysis</span><span class="nav-dot off" id="dotAnalysis"></span></button>
  <button class="nav-btn" onclick="setTab('fridge')"><span class="nav-icon off" id="navFridge">🧊</span><span class="nav-lbl" id="lblFridge" style="color:rgba(255,255,255,0.25)">Fridge</span><span class="nav-dot off" id="dotFridge"></span></button>
  <button class="nav-btn" onclick="setTab('grocery')"><span class="nav-icon off" id="navGrocery">🛒</span><span class="nav-lbl" id="lblGrocery" style="color:rgba(255,255,255,0.25)">Grocery</span><span class="nav-dot off" id="dotGrocery"></span></button>
</div>

<div class="toast hidden" id="toast" onclick="this.classList.add('hidden')"></div>
<div id="modalContainer"></div>
</div>

<script>
const USER_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;

function getLocalDate(){
const now=new Date();
return [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
}

let currentUser = null;
let S={tab:"home",today:null,fridge:[],fridgeShare:null,chatMsgs:[],sending:false,analysisData:null,analysisDays:7,logDate:null,grocLoading:false,grocery:null};

async function api(p,o={}){
const hdrs={"Content-Type":"application/json","X-Timezone":USER_TZ,...(o.headers||{})};
const r=await fetch(p,{...o,headers:hdrs});
if(r.status===401){showLogin();throw new Error("Not authenticated")}
if(!r.ok)throw new Error(`${r.status}`);return r.json()}

async function apiFetch(p,o={}){
const hdrs={"X-Timezone":USER_TZ,...(o.headers||{})};
const r=await fetch(p,{...o,headers:hdrs});
if(r.status===401){showLogin();throw new Error("Not authenticated")}
if(!r.ok)throw new Error(`${r.status}`);return r}

function toast(msg,color){const e=document.getElementById("toast");e.textContent=msg;e.style.background=color||"rgba(59,130,246,0.9)";e.classList.remove("hidden","hiding");void e.offsetWidth;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>{e.classList.add("hiding");e.classList.remove("show");setTimeout(()=>{e.classList.add("hidden");e.classList.remove("hiding")},200)},3500)}

function showLogin(){document.getElementById("loginScreen").classList.remove("hidden");document.getElementById("loginScreen").style.display="flex";document.getElementById("appShell").classList.add("hidden")}
function showApp(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("appShell").classList.remove("hidden");document.getElementById("appShell").style.display="block"}

function showProfileMenu(){
const mc=document.getElementById("modalContainer");
mc.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
<h3>Profile</h3>
<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
${currentUser.picture?`<img src="${currentUser.picture}" style="width:48px;height:48px;border-radius:50%">`:''}
<div><div style="font-weight:600;font-size:16px">${currentUser.name}</div><div style="font-size:13px;color:rgba(255,255,255,0.4)">${currentUser.email}</div></div>
</div>
<label>Daily Calories</label><input id="profCal" type="number" value="${currentUser.calories_max}">
<label>Protein Target (g)</label><input id="profProt" type="number" value="${currentUser.protein_target}">
<label>Fiber Target (g)</label><input id="profFib" type="number" value="${currentUser.fiber_target}">
<button class="btn btn-p btn-full" style="margin-top:20px" onclick="saveProfile()">Save Targets</button>
<a href="/auth/logout" class="btn btn-g btn-full" style="margin-top:8px;display:block;text-align:center;text-decoration:none;color:rgba(239,68,68,0.6)">Sign Out</a>
<button class="btn btn-g btn-full" style="margin-top:8px" onclick="closeModal()">Cancel</button>
</div></div>`}

async function saveProfile(){
const cal=parseInt(document.getElementById("profCal").value)||2000;
const prot=parseInt(document.getElementById("profProt").value)||150;
const fib=parseInt(document.getElementById("profFib").value)||30;
try{await api("/api/profile",{method:"PUT",body:JSON.stringify({calories_max:cal,protein_target:prot,fiber_target:fib})});
currentUser.calories_max=cal;currentUser.protein_target=prot;currentUser.fiber_target=fib;
closeModal();toast("Targets saved","rgba(74,222,128,0.9)");await loadToday()}catch(e){toast("Failed to save","rgba(239,68,68,0.9)")}}

function setTab(t){S.tab=t;const tabs=["home","analysis","fridge","grocery"];
const uc="#3B82F6";
tabs.forEach(x=>{const cap=x[0].toUpperCase()+x.slice(1);const ic=document.getElementById("nav"+cap);const lb=document.getElementById("lbl"+cap);const dt=document.getElementById("dot"+cap);
if(ic){if(x===t){ic.classList.remove("off");lb.style.color=uc;if(dt){dt.classList.remove("off");dt.style.background=uc}}else{ic.classList.add("off");lb.style.color="rgba(255,255,255,0.25)";if(dt)dt.classList.add("off")}}});
const el=document.getElementById("content");el.style.animation="none";void el.offsetWidth;el.style.animation="contentIn 400ms var(--ease-out) both";
if(t==="analysis")loadAnalysis();if(t==="fridge")loadFridge();render()}

// ── Data ──────────────────────────────────────────────
async function loadToday(){
try{
const viewDate = S.logDate || getLocalDate();
S.today=await api(`/api/today?client_date=${viewDate}`);
S.today._viewEntries = S.today.entries;
S.today._viewTotals = S.today.totals;
render()}catch(e){}}

function changeLogDate(offset){
const current = S.logDate || getLocalDate();
const d = new Date(current+'T12:00:00');
d.setDate(d.getDate()+offset);
const today = getLocalDate();
const newDate = [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
if(newDate > today) return;
S.logDate = newDate;
loadToday()}
async function loadFridge(){try{const d=await api("/api/fridge");S.fridge=d.items||[]}catch(e){}
try{const sh=await api("/api/fridge/share");S.fridgeShare=sh}catch(e){S.fridgeShare={shared:false}}
render()}
async function loadAnalysis(){try{S.analysisData=await api(`/api/analysis?days=${S.analysisDays}`);render()}catch(e){}}

// ── Renderers ─────────────────────────────────────────
function render(){const e=document.getElementById("content");
switch(S.tab){case"home":e.innerHTML=renderHome();break;case"analysis":e.innerHTML=renderAnalysis();break;case"fridge":e.innerHTML=renderFridge();break;case"grocery":e.innerHTML=renderGrocery();break}}

function renderHome(){
if(!S.today)return'<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.3)">Loading...</div>';
const t=S.today._viewTotals||S.today.totals,tg=S.today.targets,u={color:"#3B82F6"};

let h='';
const srcIcon=S.today.workout?.source==='apple_health'?' 🍎':'';
if(S.today.is_vacation){
h+=`<div class="workout-bar" style="background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.2);cursor:pointer" onclick="toggleVacation()">🏖️ Vacation Day — tracking paused<span style="float:right;opacity:0.4">✕</span></div>`}
else{
if(S.today.workout){h+=`<div class="workout-bar wb-active" onclick="showWorkoutModal()" style="cursor:pointer">🔥 ${S.today.workout.label}${S.today.workout.calories_burned?` · ${S.today.workout.calories_burned} cal burned${srcIcon}`:''}${S.today.is_social?' · 🍷 Social evening':''}<span style="float:right;opacity:0.4">✏️</span></div>`}
else{h+=`<div class="workout-bar wb-rest" onclick="showWorkoutModal()" style="cursor:pointer">🧘 Rest Day<span style="float:right;opacity:0.4">✏️</span></div>`}
}

const calMax=tg.calories_adjusted||tg.calories;
const wkCal=tg.workout_calories||0;
h+=`<div class="macro-bar">`;
[{label:"Calories",val:t.calories,max:calMax,color:u.color,unit:"",extra:wkCal?` <span style="font-size:11px;color:#4ADE80">(+${wkCal} workout)</span>`:''},
 {label:"Protein",val:t.protein,max:tg.protein,color:"#4ADE80",unit:"g",extra:''},
 {label:"Fiber",val:t.fiber,max:tg.fiber,color:"#FBBF24",unit:"g",extra:''}
].forEach(m=>{
const pct=Math.min((m.val/(m.max||1))*100,100);
h+=`<div class="macro-pill" style="box-shadow:0 0 20px ${m.color}10,inset 0 1px 0 rgba(255,255,255,0.06)">
<div class="macro-pill-val" style="color:${m.color};text-shadow:0 0 24px ${m.color}40">${m.val}</div>
<div class="macro-pill-sub">/ ${m.max}${m.unit}${m.extra}</div>
<div class="macro-pill-label">${m.label}</div>
<div class="macro-bar-progress"><div class="macro-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,${m.color},${m.color}cc)"></div></div>
</div>`});
h+=`</div>`;

h+=`<div class="chat-area">`;
if(S.chatMsgs.length>0){
h+=`<div class="chat-messages" id="chatMsgs">`;
S.chatMsgs.forEach(m=>{
if(m.role==="user")h+=`<div class="chat-bubble chat-user">${m.content}</div>`;
else if(m.type==="log")h+=`<div class="chat-bubble chat-log">✅ ${m.content}</div>`;
else h+=`<div class="chat-bubble chat-bot">${m.content}</div>`;
});
h+=`</div>`}

const isViewToday2 = !S.logDate || S.logDate === getLocalDate();
const inputPlaceholder = isViewToday2 ? "What's on your mind?" : `Log food for ${new Date(S.logDate+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}...`;
h+=`<div class="input-area">
<input id="chatInput" placeholder="${inputPlaceholder}" onkeydown="if(event.key==='Enter'&&!S.sending)sendChat()" ${S.sending?'disabled':''}>
<button class="send-btn" onclick="sendChat()" ${S.sending?'disabled':''}>${S.sending?'⏳':'↑'}</button>
</div>`;

h+=`<div class="quick-actions">
<button class="qa-btn" onclick="document.getElementById('snapInput').click()">📸 Snap Plate<input type="file" id="snapInput" accept="image/*" capture="environment" onchange="snapPlate(event)" style="display:none"></button>
<button class="qa-btn" onclick="showMealIdeasModal()">🍽️ Meal Ideas</button>
<button class="qa-btn" onclick="setTab('analysis')">📊 My Stats</button>
</div>`;
h+=`</div>`;

h+=renderTimeline(S.today._viewEntries || S.today.entries, true);
return h}

function renderTimeline(entries){
const viewDate = S.logDate || getLocalDate();
const isViewToday = viewDate === getLocalDate();
const dateObj = new Date(viewDate+'T12:00:00');
const dayName = dateObj.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});

let h=`<div class="timeline">`;
h+=`<div class="date-nav">
<button onclick="changeLogDate(-1)">←</button>
<div class="date-nav-center">
<div class="date-nav-day">${isViewToday ? "Today's Log" : dayName}</div>
<div class="date-nav-sub">${entries?.length||0} entries</div>
</div>
<button onclick="changeLogDate(1)" ${isViewToday?'disabled':''}>→</button>
</div>`;

if(!entries||entries.length===0){h+=`<div class="tl-empty">Nothing logged${isViewToday?' yet. Type what you ate or snap a plate.':' for this day.'}</div>`}
else{entries.forEach(e=>{
let time='';if(e.time_logged){try{const utc=new Date(e.time_logged.replace(' ','T')+'Z');time=utc.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:true})}catch(_){time=e.time_logged.split(' ')[1]?.substring(0,5)||''}}
const srcColor={chat:"#3B82F6",photo:"#FB923C",auto:"#A78BFA",manual:"#4ADE80",quick_log:"#4ADE80"}[e.source]||"#666";
h+=`<div class="tl-entry" style="--ec:${srcColor}">
<div class="tl-dot" style="background:${srcColor};color:${srcColor}"></div>
<div class="tl-content">
<div class="tl-desc">${e.description}</div>
<div class="tl-macros">
<span>🔥 ${e.calories} cal</span>
<span>💪 ${e.protein}g</span>
<span>🌾 ${e.fiber}g fiber</span>
${time?`<span style="margin-left:auto;color:rgba(255,255,255,0.2)">${time}</span>`:''}
</div>
<div class="tl-entry-actions">
<button class="tl-action-btn" onclick="editEntry(${e.id},${e.calories},${e.protein},${e.fiber},'${(e.description||'').replace(/'/g,"\\'")}',${e.quantity||1})">✏️ Edit</button>
<button class="tl-action-btn" onclick="shareEntry('${(e.description||'').replace(/'/g,"\\'")}',${e.calories},${e.protein},${e.fiber})">📤 Share</button>
<button class="tl-action-btn tl-del" onclick="deleteEntry(${e.id})">🗑 Delete</button>
</div>
</div>
</div>`})}
h+=`</div>`;return h}

function renderAnalysis(){
let h=`<div class="chart-toggle">
<button class="${S.analysisDays===7?'active':''}" onclick="S.analysisDays=7;loadAnalysis()">7 Days</button>
<button class="${S.analysisDays===30?'active':''}" onclick="S.analysisDays=30;loadAnalysis()">30 Days</button>
</div>`;

if(!S.analysisData||!S.analysisData.history||S.analysisData.history.length===0){
return h+`<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">No data yet. Log some meals first.</div></div>`}

const data=S.analysisData.history;
const tg=S.analysisData.targets;
const u={color:"#3B82F6"};

function lineChart(title, dataKey, target, color, unit){
const vals = data.map(d => d[dataKey]);
const maxVal = Math.max(...vals, target) * 1.15;
const W = 460, H = 180, PL = 40, PR = 10, PT = 20, PB = 30;
const chartW = W - PL - PR;
const chartH = H - PT - PB;
let svg = `<div class="chart-container"><div class="chart-title">${title}</div>`;
svg += `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
const targetY = PT + chartH - (target / maxVal) * chartH;
svg += `<line x1="${PL}" y1="${targetY}" x2="${W-PR}" y2="${targetY}" stroke="rgba(255,255,255,0.12)" stroke-dasharray="4,4"/>`;
svg += `<text x="${PL-4}" y="${targetY+3}" fill="rgba(255,255,255,0.25)" font-size="9" text-anchor="end">${target}${unit}</text>`;
for(let i = 0; i <= 4; i++){const y = PT + (chartH / 4) * i;svg += `<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,0.04)"/>`}
const points = data.map((d, i) => {
const x = PL + (i / Math.max(data.length - 1, 1)) * chartW;
const y = PT + chartH - (d[dataKey] / maxVal) * chartH;
return {x, y, val: d[dataKey], date: d.log_date};});
if(points.length > 1){let areaPath = `M ${points[0].x} ${points[0].y}`;points.slice(1).forEach(p => { areaPath += ` L ${p.x} ${p.y}`; });areaPath += ` L ${points[points.length-1].x} ${PT+chartH} L ${points[0].x} ${PT+chartH} Z`;svg += `<path d="${areaPath}" fill="${color}" opacity="0.08"/>`}
if(points.length > 1){let linePath = `M ${points[0].x} ${points[0].y}`;points.slice(1).forEach(p => { linePath += ` L ${p.x} ${p.y}`; });svg += `<path d="${linePath}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`}
points.forEach((p) => {const isOver = dataKey === 'total_cal' ? p.val > target : p.val < target * 0.8;svg += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${isOver ? '#EF4444' : color}" stroke="#0A0A0F" stroke-width="2"/>`;svg += `<text x="${p.x}" y="${p.y - 10}" fill="rgba(255,255,255,0.5)" font-size="9" text-anchor="middle">${p.val}${unit}</text>`;const dayLabel = new Date(p.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});svg += `<text x="${p.x}" y="${H - 6}" fill="rgba(255,255,255,0.3)" font-size="9" text-anchor="middle">${dayLabel}</text>`});
svg += `</svg></div>`;return svg}

h += lineChart('CALORIES', 'total_cal', tg.calories, u.color, '');

// Deficit line chart
const hasDeficit = data.some(d => d.deficit !== undefined);
if(hasDeficit){
const W=460,H=180,PL=40,PR=10,PT=20,PB=30;
const chartW=W-PL-PR,chartH=H-PT-PB;
const deficits=data.map(d=>d.deficit||0);
const maxAbs=Math.max(...deficits.map(d=>Math.abs(d)),200)*1.2;
let svg=`<div class="chart-container"><div class="chart-title">CALORIE DEFICIT</div>`;
svg+=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
for(let i=0;i<=4;i++){const y=PT+(chartH/4)*i;svg+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(255,255,255,0.04)"/>`}
const zeroY=PT+chartH/2;
svg+=`<line x1="${PL}" y1="${zeroY}" x2="${W-PR}" y2="${zeroY}" stroke="rgba(255,255,255,0.2)" stroke-dasharray="4,4"/>`;
svg+=`<text x="${PL-4}" y="${zeroY+3}" fill="rgba(255,255,255,0.35)" font-size="9" text-anchor="end">0</text>`;
const points=data.map((d,i)=>{
const x=PL+(i/Math.max(data.length-1,1))*chartW;
const deficit=d.deficit||0;
const y=zeroY-(deficit/maxAbs)*(chartH/2);
return{x,y,val:deficit,date:d.log_date}});
if(points.length>1){let areaPath=`M ${points[0].x} ${points[0].y}`;points.slice(1).forEach(p=>{areaPath+=` L ${p.x} ${p.y}`});areaPath+=` L ${points[points.length-1].x} ${zeroY} L ${points[0].x} ${zeroY} Z`;svg+=`<path d="${areaPath}" fill="#4ADE80" opacity="0.08"/>`}
if(points.length>1){let linePath=`M ${points[0].x} ${points[0].y}`;points.slice(1).forEach(p=>{linePath+=` L ${p.x} ${p.y}`});svg+=`<path d="${linePath}" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`}
points.forEach(p=>{const color=p.val<=0?'#4ADE80':'#EF4444';svg+=`<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}" stroke="#0A0A0F" stroke-width="2"/>`;svg+=`<text x="${p.x}" y="${p.y-10}" fill="${color}" font-size="9" text-anchor="middle">${p.val>0?'+':''}${p.val}</text>`;const dayLabel=new Date(p.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});svg+=`<text x="${p.x}" y="${H-6}" fill="rgba(255,255,255,0.3)" font-size="9" text-anchor="middle">${dayLabel}</text>`});
svg+=`</svg></div>`;
h+=svg}

h += lineChart('PROTEIN', 'total_protein', tg.protein, '#4ADE80', 'g');
h += lineChart('FIBER', 'total_fiber', tg.fiber, '#FBBF24', 'g');

const active=data.filter(d=>!d.is_vacation);
const aN=active.length||1;
const vacDays=data.length-active.length;
const avgCal=Math.round(active.reduce((s,d)=>s+d.total_cal,0)/aN);
const avgProt=Math.round(active.reduce((s,d)=>s+d.total_protein,0)/aN);
const avgFib=Math.round(active.reduce((s,d)=>s+d.total_fiber,0)/aN);
const totalDeficit=active.reduce((s,d)=>s+(d.deficit||0),0);
const avgDeficit=Math.round(totalDeficit/aN);
const totalWkCal=active.reduce((s,d)=>s+(d.workout_calories||0),0);

h+=`<div class="avg-card">
<div class="avg-title">Averages (${active.length} days${vacDays?` · ${vacDays} vacation`:''})</div>
<div class="avg-row">
<div class="avg-item"><span style="color:${u.color};text-shadow:0 0 20px ${u.color}30">${avgCal}</span><span> cal/day</span></div>
<div class="avg-item"><span style="color:#4ADE80;text-shadow:0 0 20px rgba(74,222,128,0.2)">${avgProt}g</span><span> protein</span></div>
<div class="avg-item"><span style="color:#FBBF24;text-shadow:0 0 20px rgba(251,191,36,0.2)">${avgFib}g</span><span> fiber</span></div>
</div></div>`;

if(hasDeficit){
const defColor=totalDeficit<=0?'#4ADE80':'#EF4444';
const lbsLost=(Math.abs(totalDeficit)/3500).toFixed(1);
h+=`<div class="avg-card">
<div class="avg-title">Deficit Summary</div>
<div class="avg-row">
<div class="avg-item"><span style="color:${defColor}">${avgDeficit>0?'+':''}${avgDeficit}</span><span> cal/day avg</span></div>
<div class="avg-item"><span style="color:${defColor}">${totalDeficit>0?'+':''}${totalDeficit}</span><span> total</span></div>
<div class="avg-item"><span style="color:#4ADE80">${totalWkCal}</span><span> workout cal</span></div>
</div>
<div style="text-align:center;margin-top:10px;font-size:12px;color:rgba(255,255,255,0.5)">${totalDeficit<=0?`On track: ~${lbsLost} lbs deficit (3500 cal = 1 lb)`:`Over target by ${totalDeficit} cal`}</div>
</div>`}

const totalDrinks=data.reduce((s,d)=>s+(d.drinks||0),0);
const totalDrinkCal=active.reduce((s,d)=>s+(d.drink_calories||0),0);
if(totalDrinks>0){
const drinkDays=active.filter(d=>d.drinks>0).length;
const avgDrinksPerDrinkDay=(totalDrinks/(drinkDays||1)).toFixed(1);
const totalActiveCal=active.reduce((s,d)=>s+d.total_cal,0);
const pctCal=totalActiveCal?Math.round(totalDrinkCal/totalActiveCal*100):0;
h+=`<div class="avg-card">
<div class="avg-title" style="color:#FB923C">🍺 Drinks Summary</div>
<div class="avg-row">
<div class="avg-item"><span style="color:#FB923C">${totalDrinks}</span><span> drinks</span></div>
<div class="avg-item"><span style="color:#FB923C">${totalDrinkCal}</span><span> cal from drinks</span></div>
<div class="avg-item"><span style="color:#FB923C">${pctCal}%</span><span> of total cal</span></div>
</div>
<div style="text-align:center;margin-top:10px;font-size:12px;color:rgba(255,255,255,0.5)">${drinkDays} of ${active.length} days · ~${avgDrinksPerDrinkDay} drinks on those days</div>
</div>`}

return h}

function updateWorkoutLabel(){
const timeInput=document.getElementById("wkTime");
const labelInput=document.getElementById("wkLabel");
if(!timeInput||!labelInput)return;
const t=timeInput.value;
if(!t)return;
const [h,m]=t.split(':').map(Number);
const ampm=h>=12?'PM':'AM';
const h12=h%12||12;
const timeStr=`${h12}:${String(m).padStart(2,'0')} ${ampm}`;
const oldLabel=labelInput.value;
const timePattern=/\d{1,2}:\d{2}\s*(AM|PM|am|pm)/;
if(timePattern.test(oldLabel)){labelInput.value=oldLabel.replace(timePattern,timeStr)}
else if(oldLabel){labelInput.value=`${oldLabel} ${timeStr}`}
else{labelInput.value=`Workout ${timeStr}`}}

async function deleteEntry(id){if(!confirm("Delete?"))return;await api(`/api/food-log/${id}`,{method:"DELETE"});await loadToday()}

function editEntry(id,cal,prot,fib,desc,qty){
qty=qty||1;
const baseCal=Math.round(cal/qty),baseProt=Math.round(prot/qty),baseFib=Math.round(fib/qty);
const mc=document.getElementById("modalContainer");
mc.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
<h3>Edit Entry</h3>
<label>Description</label><input id="editDesc" value="${desc.replace(/"/g,'&quot;')}">
<label style="margin-top:4px">Quantity</label>
<div class="selector-toggle" id="qtyToggle" data-base-cal="${baseCal}" data-base-prot="${baseProt}" data-base-fib="${baseFib}">
<button ${qty===1?'class="active"':''} onclick="setQty(this,1)" data-val="1">1</button>
<button ${qty===2?'class="active"':''} onclick="setQty(this,2)" data-val="2">2</button>
<button ${qty===3?'class="active"':''} onclick="setQty(this,3)" data-val="3">3</button>
<button ${qty===4?'class="active"':''} onclick="setQty(this,4)" data-val="4">4</button>
</div>
<div style="display:flex;gap:8px;margin-top:4px">
<div style="flex:1"><label>Calories</label><input id="editCal" type="number" value="${cal}"></div>
<div style="flex:1"><label>Protein</label><input id="editProt" type="number" value="${prot}"></div>
<div style="flex:1"><label>Fiber</label><input id="editFib" type="number" value="${fib}"></div>
</div>
<div style="display:flex;gap:8px;margin-top:20px">
<button class="btn btn-green" style="flex:1" onclick="submitEdit(${id},false)">Save</button>
<button class="btn btn-p" style="flex:1" onclick="submitEdit(${id},true)">Re-estimate</button>
</div>
<button class="btn btn-g btn-full" style="margin-top:8px" onclick="closeModal()">Cancel</button>
</div></div>`}

function setQty(btn,qty){
btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
const t=document.getElementById('qtyToggle');
document.getElementById('editCal').value=Math.round(parseInt(t.dataset.baseCal)*qty);
document.getElementById('editProt').value=Math.round(parseInt(t.dataset.baseProt)*qty);
document.getElementById('editFib').value=Math.round(parseInt(t.dataset.baseFib)*qty)}

async function submitEdit(id,reEst){
const desc=document.getElementById("editDesc").value.trim();
const cal=parseInt(document.getElementById("editCal").value)||0;
const prot=parseInt(document.getElementById("editProt").value)||0;
const fib=parseInt(document.getElementById("editFib").value)||0;
const qtyBtn=document.querySelector('#qtyToggle button.active');
const qty=qtyBtn?parseInt(qtyBtn.dataset.val)||1:1;
if(reEst&&desc){toast("Re-estimating...","rgba(59,130,246,0.9)");
try{const r=await api("/api/estimate",{method:"POST",body:JSON.stringify({message:desc})});
document.getElementById("editCal").value=r.calories||0;
document.getElementById("editProt").value=r.protein||0;
document.getElementById("editFib").value=r.fiber||0;
const t=document.getElementById('qtyToggle');
t.dataset.baseCal=r.calories||0;t.dataset.baseProt=r.protein||0;t.dataset.baseFib=r.fiber||0;
document.querySelectorAll('#qtyToggle button').forEach(b=>b.classList.remove('active'));
document.querySelector('#qtyToggle button[data-val="1"]').classList.add('active');
toast(`Re-estimated: ${r.calories} cal, ${r.protein}g protein`,"rgba(74,222,128,0.9)")}
catch(e){toast("Re-estimate failed","rgba(239,68,68,0.9)")}}
else{closeModal();
await api(`/api/food-log/${id}`,{method:"PUT",body:JSON.stringify({calories:cal,protein:prot,fiber:fib,description:desc||undefined,quantity:qty})});
await loadToday()}}

function closeModal(){document.getElementById("modalContainer").innerHTML=""}

// ── Fridge actions ───────────────────────────────────
async function addFridgeItem(){
const n=document.getElementById("fridgeInput").value.trim();if(!n)return;
const q=document.getElementById("fridgeQtyInput")?.value.trim()||"";
await api("/api/fridge",{method:"POST",body:JSON.stringify({name:n,quantity:q})});
document.getElementById("fridgeInput").value="";
if(document.getElementById("fridgeQtyInput"))document.getElementById("fridgeQtyInput").value="";
await loadFridge()}

async function removeFridgeById(id){await api(`/api/fridge/id/${id}`,{method:"DELETE"});await loadFridge()}
async function clearFridge(){if(!confirm("Clear all?"))return;await api("/api/fridge",{method:"DELETE"});await loadFridge()}

function editFridgeItem(id,name,qty,category){
const mc=document.getElementById("modalContainer");
mc.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
<h3>Edit Item</h3>
<label>Name</label><input id="efName" value="${name.replace(/"/g,'&quot;')}">
<label>Quantity</label><input id="efQty" value="${qty.replace(/"/g,'&quot;')}">
<label>Category</label>
<select id="efCat">
<option value="produce" ${category==='produce'?'selected':''}>🥬 Produce</option>
<option value="protein" ${category==='protein'?'selected':''}>🥩 Protein</option>
<option value="dairy" ${category==='dairy'?'selected':''}>🥛 Dairy</option>
<option value="pantry" ${category==='pantry'?'selected':''}>🥫 Pantry</option>
<option value="frozen" ${category==='frozen'?'selected':''}>🧊 Frozen</option>
<option value="beverages" ${category==='beverages'?'selected':''}>🥤 Beverages</option>
<option value="other" ${category==='other'?'selected':''}>📦 Other</option>
</select>
<button class="btn btn-green btn-full" style="margin-top:20px" onclick="saveFridgeEdit(${id})">Save</button>
<button class="btn btn-g btn-full" style="margin-top:8px" onclick="closeModal()">Cancel</button>
</div></div>`}

async function saveFridgeEdit(id){
const name=document.getElementById("efName").value.trim();
const qty=document.getElementById("efQty").value.trim();
const cat=document.getElementById("efCat").value;
closeModal();
try{await api(`/api/fridge/${id}`,{method:"PUT",body:JSON.stringify({name:name||undefined,quantity:qty,category:cat})});
toast("Item updated","rgba(74,222,128,0.9)");await loadFridge()}catch(e){toast("Failed to update","rgba(239,68,68,0.9)")}}

// ── Fridge sharing ──────────────────────────────────
async function createFridgeShare(){
try{const r=await api("/api/fridge/share",{method:"POST"});
showFridgeCodeModal(r.code)}catch(e){toast("Failed to create share","rgba(239,68,68,0.9)")}}

function showFridgeCodeModal(code){
const mc=document.getElementById("modalContainer");
mc.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
<h3>Share Your Fridge</h3>
<div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:16px">Share this code with your household members so they can join your fridge.</div>
<div style="text-align:center;font-size:32px;font-weight:700;letter-spacing:0.15em;padding:20px;background:rgba(255,255,255,0.06);border-radius:var(--radius-sm);margin-bottom:16px;user-select:all">${code}</div>
<button class="btn btn-green btn-full" onclick="navigator.clipboard.writeText('${code}');toast('Code copied','rgba(74,222,128,0.9)')">Copy Code</button>
<button class="btn btn-g btn-full" style="margin-top:8px" onclick="closeModal()">Done</button>
</div></div>`}

function showJoinFridgeModal(){
const mc=document.getElementById("modalContainer");
mc.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
<h3>Join Shared Fridge</h3>
<div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:16px">Enter the share code from a household member.</div>
<input id="joinCode" placeholder="Enter code" style="text-align:center;font-size:20px;letter-spacing:0.1em;text-transform:uppercase">
<button class="btn btn-green btn-full" style="margin-top:16px" onclick="joinFridge()">Join</button>
<button class="btn btn-g btn-full" style="margin-top:8px" onclick="closeModal()">Cancel</button>
</div></div>`}

async function joinFridge(){
const code=document.getElementById("joinCode").value.trim();
if(!code){toast("Enter a code","rgba(239,68,68,0.9)");return}
closeModal();
try{await api("/api/fridge/join",{method:"POST",body:JSON.stringify({code})});
toast("Joined shared fridge","rgba(74,222,128,0.9)");await loadFridge()}catch(e){toast("Invalid code","rgba(239,68,68,0.9)")}}

function showFridgeShareModal(){
const sh=S.fridgeShare;if(!sh)return;
const mc=document.getElementById("modalContainer");
const memberList=sh.members.map(m=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0">
${m.picture?`<img src="${m.picture}" style="width:28px;height:28px;border-radius:50%">`:''}
<span style="font-size:14px">${m.name}</span></div>`).join('');
mc.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
<h3>Shared Fridge</h3>
<div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:12px">Code: <span style="font-weight:700;color:rgba(255,255,255,0.8);letter-spacing:0.1em">${sh.code}</span></div>
<div style="margin-bottom:16px">${memberList}</div>
<button class="btn btn-green btn-full" onclick="navigator.clipboard.writeText('${sh.code}');toast('Code copied','rgba(74,222,128,0.9)')">Copy Code</button>
<button class="btn btn-g btn-full" style="margin-top:8px;color:rgba(239,68,68,0.5)" onclick="leaveFridge()">Leave Shared Fridge</button>
<button class="btn btn-g btn-full" style="margin-top:8px" onclick="closeModal()">Done</button>
</div></div>`}

async function leaveFridge(){
if(!confirm("Leave shared fridge? You'll start with an empty fridge."))return;
closeModal();
try{await api("/api/fridge/leave",{method:"POST"});
toast("Left shared fridge","rgba(74,222,128,0.9)");await loadFridge()}catch(e){toast("Failed","rgba(239,68,68,0.9)")}}

// ── Scan review modals ───────────────────────────────
async function uploadFridgePhoto(e){const f=e.target.files?.[0];if(!f)return;
toast("Scanning fridge...","rgba(59,130,246,0.9)");
const fd=new FormData();fd.append("file",f);
try{const r=await apiFetch("/api/photo/fridge",{method:"POST",body:fd});const d=await r.json();
showScanReviewModal(d.items||[],"fridge")}catch(e){toast("Scan failed","rgba(239,68,68,0.9)")}}

async function uploadReceipt(e){const f=e.target.files?.[0];if(!f)return;
toast("Scanning receipt...","rgba(59,130,246,0.9)");
const fd=new FormData();fd.append("file",f);
try{const r=await apiFetch("/api/photo/receipt",{method:"POST",body:fd});const d=await r.json();
showScanReviewModal(d.items||[],"receipt",d.store||"")}catch(e){toast("Scan failed","rgba(239,68,68,0.9)")}}

function showScanReviewModal(items,source,store){
const mc=document.getElementById("modalContainer");
let rows='';
items.forEach((item,i)=>{
const name=item.name||'';
const qty=item.quantity||'';
rows+=`<div class="scan-row" data-idx="${i}">
<input class="scan-name" value="${name.replace(/"/g,'&quot;')}" placeholder="Item name">
<input class="scan-qty" value="${qty.replace(/"/g,'&quot;')}" placeholder="Qty">
<button class="scan-del" onclick="this.parentElement.remove()">×</button>
</div>`});

mc.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
<h3>${source==='receipt'?'Review Receipt Items':'Review Fridge Items'}${store?' from '+store:''}</h3>
<div style="font-size:12px;color:rgba(255,255,255,0.35);margin-bottom:14px">${items.length} items found. Edit names and quantities, remove unwanted items.</div>
<div id="scanItemsList">${rows}</div>
<button class="btn btn-g btn-sm" style="margin-top:4px;margin-bottom:16px" onclick="addScanRow()">+ Add Item</button>
<button class="btn btn-green btn-full" onclick="confirmScan('${source}','${(store||'').replace(/'/g,"\\'")}')">Confirm ${items.length} Items</button>
<button class="btn btn-g btn-full" style="margin-top:8px" onclick="closeModal()">Cancel</button>
</div></div>`}

function addScanRow(){
const list=document.getElementById("scanItemsList");
const div=document.createElement("div");div.className="scan-row";
div.innerHTML=`<input class="scan-name" placeholder="Item name"><input class="scan-qty" placeholder="Qty"><button class="scan-del" onclick="this.parentElement.remove()">×</button>`;
list.appendChild(div)}

async function confirmScan(source,store){
const rows=document.querySelectorAll("#scanItemsList .scan-row");
const items=[];
rows.forEach(row=>{
const name=row.querySelector(".scan-name")?.value.trim();
const qty=row.querySelector(".scan-qty")?.value.trim()||"";
if(name)items.push({name,quantity:qty,category:"other"})});
closeModal();
if(items.length===0){toast("No items to add","rgba(239,68,68,0.9)");return}
try{await api("/api/fridge/bulk",{method:"POST",body:JSON.stringify({items,source,store})});
toast(`Added ${items.length} items`,"rgba(74,222,128,0.9)");await loadFridge()}catch(e){toast("Failed to save items","rgba(239,68,68,0.9)")}}

// ── Grocery ──────────────────────────────────────────
async function genGrocery(){S.grocLoading=true;render();
try{const d=await api("/api/grocery/generate",{method:"POST"});S.grocery=d.grocery}catch(e){toast("Failed","rgba(239,68,68,0.9)")}
S.grocLoading=false;render()}

// ── Init ─────────────────────────────────────────────
async function init(){
try{
const r=await fetch("/auth/me",{headers:{"X-Timezone":USER_TZ}});
if(!r.ok)throw new Error("not auth");
const d=await r.json();
currentUser=d.user;
document.getElementById("userName").textContent=currentUser.name.split(" ")[0];
if(currentUser.picture){const pic=document.getElementById("userPic");pic.src=currentUser.picture;pic.style.display="block"}
showApp();
document.getElementById("dotHome").style.background="#3B82F6";
loadToday();loadFridge();render();
}catch(e){showLogin()}}
init();
</script>
</body>
</html>
